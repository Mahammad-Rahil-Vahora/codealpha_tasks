<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Task Manager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app-shell">

  <header class="app-header">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between gap-3">
        <div class="brand">
          <span class="brand-mark">/</span>
          <span class="brand-name">TaskFlow</span>
        </div>
        <div class="today-date" id="todayDate"></div>
      </div>
    </div>
  </header>

  <main class="container app-main">

    <!-- Dashboard -->
    <section class="overview-row" aria-label="Task dashboard">
      <div class="stat-block">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Total tasks</span>
      </div>

      <div class="stat-block">
        <span class="stat-value" id="statActive">0</span>
        <span class="stat-label">In progress</span>
      </div>

      <div class="stat-block">
        <span class="stat-value" id="statDone">0</span>
        <span class="stat-label">Completed</span>
      </div>

      <div class="stat-block progress-block">
        <div class="d-flex justify-content-between mb-2">
          <span class="stat-label">Overall progress</span>
          <span class="stat-label" id="statPercent">0%</span>
        </div>
        <div class="progress-track" aria-label="Task completion progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </section>

    <!-- Add Task Form -->
    <section class="add-task-panel" aria-label="Add new task">
      <h2 class="section-title">Add Task</h2>

      <form id="taskForm" class="row g-2">
        <div class="col-12 col-md-5">
          <label class="visually-hidden" for="taskInput">Task title</label>
          <input
            type="text"
            class="form-control task-input"
            id="taskInput"
            placeholder="What needs to get done?"
            maxlength="120"
            autocomplete="off"
            required>
        </div>

        <div class="col-6 col-md-3">
          <label class="visually-hidden" for="prioritySelect">Priority</label>
          <select class="form-select task-select" id="prioritySelect">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>
        </div>

        <div class="col-6 col-md-2">
          <label class="visually-hidden" for="dueDate">Due date</label>
          <input type="date" class="form-control task-select" id="dueDate">
        </div>

        <div class="col-12 col-md-2">
          <button type="submit" class="btn btn-add w-100">
            <i class="bi bi-plus-lg"></i> Add Task
          </button>
        </div>
      </form>
    </section>

    <!-- Filters -->
    <section class="filter-row" aria-label="Task filters">
      <div class="filter-tabs" id="filterTabs" role="group" aria-label="Filter tasks">
        <button type="button" class="filter-tab active" data-filter="all">All</button>
        <button type="button" class="filter-tab" data-filter="active">Active</button>
        <button type="button" class="filter-tab" data-filter="completed">Completed</button>
      </div>

      <button type="button" class="btn-clear" id="clearCompleted">
        <i class="bi bi-trash3"></i> Clear completed
      </button>
    </section>

    <!-- Task List -->
    <section class="task-list-wrap">
      <ul class="task-list" id="taskList"></ul>

      <div class="empty-state" id="emptyState">
        <i class="bi bi-check2-circle"></i>
        <h3>No tasks found</h3>
        <p id="emptyMessage">Add your first task above.</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <span>TaskFlow · Tasks are saved automatically in this browser</span>
    </div>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
